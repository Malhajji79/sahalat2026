<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سهالات - نموذج أولي</title>
  <style>

:root{
  --navy:#0f2a5f; --blue:#2f6fed; --bg:#f5f7fb; --card:#fff; --text:#172033;
  --muted:#6b7280; --border:#e5e7eb; --green:#0f9d78; --red:#d64545; --amber:#d68a00;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Arabic",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}


.login-wrap{
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  box-sizing:border-box;
  overflow:auto;
  display:flex;
  justify-content:center;
  padding:clamp(18px,3vh,38px) 16px 30px;
  background:
    radial-gradient(circle at 16% 8%,rgba(151,235,86,.25),transparent 24%),
    radial-gradient(circle at 85% 55%,rgba(55,190,90,.20),transparent 28%),
    url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22700%22%20height%3D%22700%22%20viewBox%3D%220%200%20700%20700%22%3E%0A%3Cdefs%3E%3ClinearGradient%20id%3D%22l%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%23b8f35c%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%233bbd63%22/%3E%3C/linearGradient%3E%3C/defs%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22url%28%23l%29%22%20stroke-opacity%3D%22.30%22%20stroke-width%3D%223%22%3E%0A%20%3Cpath%20d%3D%22M-10%20300C70%20250%20110%20175%20135%2055%22/%3E%0A%20%3Cpath%20d%3D%22M710%20160C625%20205%20595%20300%20590%20410%22/%3E%0A%20%3Cpath%20d%3D%22M80%20710C135%20625%20210%20590%20300%20570%22/%3E%0A%20%3Cpath%20d%3D%22M700%20590C620%20550%20565%20515%20525%20445%22/%3E%0A%3C/g%3E%0A%3Cg%20fill%3D%22url%28%23l%29%22%20fill-opacity%3D%22.28%22%3E%0A%20%3Cellipse%20cx%3D%2240%22%20cy%3D%22260%22%20rx%3D%2220%22%20ry%3D%2248%22%20transform%3D%22rotate%28-52%2040%20260%29%22/%3E%0A%20%3Cellipse%20cx%3D%2278%22%20cy%3D%22212%22%20rx%3D%2218%22%20ry%3D%2244%22%20transform%3D%22rotate%2840%2078%20212%29%22/%3E%0A%20%3Cellipse%20cx%3D%22106%22%20cy%3D%22152%22%20rx%3D%2216%22%20ry%3D%2240%22%20transform%3D%22rotate%28-35%20106%20152%29%22/%3E%0A%20%3Cellipse%20cx%3D%22650%22%20cy%3D%22205%22%20rx%3D%2219%22%20ry%3D%2246%22%20transform%3D%22rotate%2848%20650%20205%29%22/%3E%0A%20%3Cellipse%20cx%3D%22620%22%20cy%3D%22270%22%20rx%3D%2217%22%20ry%3D%2242%22%20transform%3D%22rotate%28-38%20620%20270%29%22/%3E%0A%20%3Cellipse%20cx%3D%22604%22%20cy%3D%22340%22%20rx%3D%2215%22%20ry%3D%2238%22%20transform%3D%22rotate%2834%20604%20340%29%22/%3E%0A%20%3Cellipse%20cx%3D%22132%22%20cy%3D%22642%22%20rx%3D%2216%22%20ry%3D%2240%22%20transform%3D%22rotate%2848%20132%20642%29%22/%3E%0A%20%3Cellipse%20cx%3D%22194%22%20cy%3D%22607%22%20rx%3D%2215%22%20ry%3D%2236%22%20transform%3D%22rotate%28-45%20194%20607%29%22/%3E%0A%20%3Cellipse%20cx%3D%22622%22%20cy%3D%22555%22%20rx%3D%2216%22%20ry%3D%2240%22%20transform%3D%22rotate%28-48%20622%20555%29%22/%3E%0A%3C/g%3E%0A%3Cg%20fill%3D%22%23fff%22%20fill-opacity%3D%22.09%22%3E%0A%20%3Ccircle%20cx%3D%22565%22%20cy%3D%2270%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22590%22%20cy%3D%2270%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22615%22%20cy%3D%2270%22%20r%3D%224%22/%3E%0A%20%3Ccircle%20cx%3D%22565%22%20cy%3D%2295%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22590%22%20cy%3D%2295%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22615%22%20cy%3D%2295%22%20r%3D%224%22/%3E%0A%20%3Ccircle%20cx%3D%22565%22%20cy%3D%22120%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22590%22%20cy%3D%22120%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22615%22%20cy%3D%22120%22%20r%3D%224%22/%3E%0A%3C/g%3E%0A%3C/svg%3E"),
    linear-gradient(145deg,#056533 0%,#159149 45%,#08733a 100%);
  background-size:auto,auto,700px 700px,cover;
  background-position:center;
}
.login-stage{
  width:min(590px,100%);
  min-height:calc(100dvh - 68px);
  display:grid;
  grid-template-rows:auto auto auto auto;
  align-content:center;
  justify-items:center;
  gap:clamp(7px,1.35vh,15px);
}
.login-title{
  margin:0;color:#fff;font-weight:900;
  font-size:clamp(50px,7.5vw,82px);line-height:1;
  text-shadow:0 8px 18px rgba(0,45,20,.26)
}
.login-subtitle{
  color:rgba(255,255,255,.92);font-size:clamp(14px,2vw,18px);
  font-weight:700;text-align:center;margin:0
}
.login-art{
  display:block;width:clamp(230px,36vw,350px);max-width:78vw;height:auto;
  border-radius:28px;box-shadow:0 16px 34px rgba(0,45,20,.18)
}
.login-card{width:100%;display:flex;justify-content:center}
.login-panel{
  width:min(470px,100%);background:rgba(255,255,255,.985);
  border:1px solid rgba(255,255,255,.85);border-radius:26px;
  padding:clamp(21px,3.2vw,31px);box-shadow:0 24px 58px rgba(0,43,20,.29)
}
.login-panel h2{margin:0 0 16px;text-align:center;color:#14713b;font-size:clamp(23px,3vw,29px)}
.login-panel .field label{color:#14713b;font-weight:800}
.login-panel .field input,.login-panel .field select{min-height:50px;border-radius:13px;border-color:#d3ddd7}
.login-panel .btn-primary{width:100%;min-height:52px;background:linear-gradient(135deg,#27a958,#08743a);font-size:18px}
.login-panel .btn-primary:hover{filter:brightness(.94)}
.login-brand{display:none!important}
@media(max-width:700px){
 .login-wrap{padding:16px 13px 22px;background-size:auto,auto,470px 470px,cover}
 .login-stage{min-height:calc(100dvh - 38px);gap:8px}
 .login-title{font-size:clamp(50px,15vw,68px)}
 .login-subtitle{font-size:13px}
 .login-art{width:clamp(205px,62vw,285px);max-width:82vw}
 .login-panel{padding:20px 17px;border-radius:21px}
}
@media(max-height:760px) and (min-width:701px){
 .login-wrap{padding:10px 16px 16px}
 .login-stage{min-height:calc(100dvh - 26px);gap:5px}
 .login-title{font-size:48px}
 .login-subtitle{font-size:13px}
 .login-art{width:205px}
 .login-panel{padding:17px 24px}
 .login-panel h2{margin-bottom:9px;font-size:22px}
 .login-panel .field{margin-bottom:8px}
}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:14px;color:#4b5563}
.field input,.field select{padding:12px 14px;border:1px solid #cfd6e4;border-radius:10px;background:#fff}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:#eef2f8;color:#1f2937}
.btn-danger{background:#fee2e2;color:#991b1b}
.btn-success{background:#dcfce7;color:#166534}
.btn:disabled{opacity:.5;cursor:not-allowed}

.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{color:#fff;padding:24px 18px;background:
    radial-gradient(circle at 16% 8%,rgba(151,235,86,.25),transparent 24%),
    radial-gradient(circle at 85% 55%,rgba(55,190,90,.20),transparent 28%),
    url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22700%22%20height%3D%22700%22%20viewBox%3D%220%200%20700%20700%22%3E%0A%3Cdefs%3E%3ClinearGradient%20id%3D%22l%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%23b8f35c%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%233bbd63%22/%3E%3C/linearGradient%3E%3C/defs%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22url%28%23l%29%22%20stroke-opacity%3D%22.30%22%20stroke-width%3D%223%22%3E%0A%20%3Cpath%20d%3D%22M-10%20300C70%20250%20110%20175%20135%2055%22/%3E%0A%20%3Cpath%20d%3D%22M710%20160C625%20205%20595%20300%20590%20410%22/%3E%0A%20%3Cpath%20d%3D%22M80%20710C135%20625%20210%20590%20300%20570%22/%3E%0A%20%3Cpath%20d%3D%22M700%20590C620%20550%20565%20515%20525%20445%22/%3E%0A%3C/g%3E%0A%3Cg%20fill%3D%22url%28%23l%29%22%20fill-opacity%3D%22.28%22%3E%0A%20%3Cellipse%20cx%3D%2240%22%20cy%3D%22260%22%20rx%3D%2220%22%20ry%3D%2248%22%20transform%3D%22rotate%28-52%2040%20260%29%22/%3E%0A%20%3Cellipse%20cx%3D%2278%22%20cy%3D%22212%22%20rx%3D%2218%22%20ry%3D%2244%22%20transform%3D%22rotate%2840%2078%20212%29%22/%3E%0A%20%3Cellipse%20cx%3D%22106%22%20cy%3D%22152%22%20rx%3D%2216%22%20ry%3D%2240%22%20transform%3D%22rotate%28-35%20106%20152%29%22/%3E%0A%20%3Cellipse%20cx%3D%22650%22%20cy%3D%22205%22%20rx%3D%2219%22%20ry%3D%2246%22%20transform%3D%22rotate%2848%20650%20205%29%22/%3E%0A%20%3Cellipse%20cx%3D%22620%22%20cy%3D%22270%22%20rx%3D%2217%22%20ry%3D%2242%22%20transform%3D%22rotate%28-38%20620%20270%29%22/%3E%0A%20%3Cellipse%20cx%3D%22604%22%20cy%3D%22340%22%20rx%3D%2215%22%20ry%3D%2238%22%20transform%3D%22rotate%2834%20604%20340%29%22/%3E%0A%20%3Cellipse%20cx%3D%22132%22%20cy%3D%22642%22%20rx%3D%2216%22%20ry%3D%2240%22%20transform%3D%22rotate%2848%20132%20642%29%22/%3E%0A%20%3Cellipse%20cx%3D%22194%22%20cy%3D%22607%22%20rx%3D%2215%22%20ry%3D%2236%22%20transform%3D%22rotate%28-45%20194%20607%29%22/%3E%0A%20%3Cellipse%20cx%3D%22622%22%20cy%3D%22555%22%20rx%3D%2216%22%20ry%3D%2240%22%20transform%3D%22rotate%28-48%20622%20555%29%22/%3E%0A%3C/g%3E%0A%3Cg%20fill%3D%22%23fff%22%20fill-opacity%3D%22.09%22%3E%0A%20%3Ccircle%20cx%3D%22565%22%20cy%3D%2270%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22590%22%20cy%3D%2270%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22615%22%20cy%3D%2270%22%20r%3D%224%22/%3E%0A%20%3Ccircle%20cx%3D%22565%22%20cy%3D%2295%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22590%22%20cy%3D%2295%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22615%22%20cy%3D%2295%22%20r%3D%224%22/%3E%0A%20%3Ccircle%20cx%3D%22565%22%20cy%3D%22120%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22590%22%20cy%3D%22120%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22615%22%20cy%3D%22120%22%20r%3D%224%22/%3E%0A%3C/g%3E%0A%3C/svg%3E"),
    linear-gradient(145deg,#056533 0%,#159149 45%,#08733a 100%);
  background-size:auto,auto,700px 700px,cover;
  background-position:center;background-attachment:fixed}
.brand{font-size:28px;font-weight:800;margin-bottom:6px}
.brand-sub{font-size:13px;opacity:.75;margin-bottom:24px}
.nav{display:flex;flex-direction:column;gap:8px}
.nav button{background:transparent;color:#dbe7ff;border:0;border-radius:10px;padding:12px 14px;text-align:right}
.nav button.active,.nav button:hover{background:rgba(255,255,255,.12);color:#fff}
.main{padding:28px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px}
.topbar h2{margin:0}
.user-badge{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:14px}
.grid{display:grid;gap:16px}
.grid.cards{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px}
.card .kpi{font-size:28px;font-weight:800;margin-top:8px}
.muted{color:var(--muted)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0;flex-wrap:wrap}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:13px 14px;border-bottom:1px solid var(--border);text-align:right;font-size:14px}
th{background:#f8fafc;color:#475569}
/* القرض الذي تم تحصيل دفعة له ضمن دورة 26-5 يظهر أخضر بالكامل. */
tr.loan-paid-current-window>td{background:#dcfce7!important;color:#14532d}
tr.loan-paid-current-window:hover>td{background:#bbf7d0!important}
tr.loan-paid-current-window .openLoan{background:#bbf7d0;color:#14532d}
.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}
.status.active{background:#dcfce7;color:#166534}
.status.pending{background:#fef3c7;color:#92400e}
.status.rejected{background:#fee2e2;color:#991b1b}
.status.disabled{background:#e5e7eb;color:#4b5563}

.wizard{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.section-title{margin:0 0 14px;font-size:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.summary{position:sticky;top:20px;height:max-content}
.summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--border)}
.summary-row strong{font-size:16px}
.stepper{display:flex;gap:8px;margin-bottom:18px}
.step{padding:8px 12px;border-radius:999px;background:#e9eef8;color:#475569;font-size:13px}
.step.active{background:var(--blue);color:#fff}
.notice{padding:12px 14px;border-radius:10px;background:#fff7ed;color:#9a3412;margin-bottom:14px}
.actions{display:flex;gap:10px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.small{font-size:12px}

@media (max-width:900px){
  .login-wrap{grid-template-columns:1fr}
  .login-brand{display:none}
  .shell{grid-template-columns:1fr}
  .sidebar{position:sticky;top:0;z-index:5;padding:10px 12px}
  .brand-sub{display:none}.brand{font-size:20px;margin:0 0 8px}
  .nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap}
  .main{padding:16px}
  .grid.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wizard{grid-template-columns:1fr}
  .summary{position:static}
}
@media (max-width:560px){
  .grid.cards{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
}


.compact-metrics .card{padding:12px}
.compact-metrics .card .kpi{font-size:17px!important}
.compact-metrics .card .muted{font-size:12px}
@media (max-width:1150px){
  .compact-metrics{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}
@media (max-width:800px){
  .user-dashboard-layout{grid-template-columns:1fr!important}
  .compact-metrics{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}
@media (max-width:520px){
  .compact-metrics{grid-template-columns:1fr!important}
}


/* Analytics: larger, clearer, responsive Arabic numerals */
#content .analytics-number{font-size:clamp(1.05rem,1.5vw,1.35rem);font-weight:900;line-height:1.35}
#content .analytics-dashboard .kpi{font-size:clamp(1.45rem,2.6vw,2.25rem)!important;font-weight:900;line-height:1.25}
#content .analytics-dashboard table td,#content .analytics-dashboard table th{font-size:clamp(.9rem,1.15vw,1.08rem);padding:12px 10px}
#content .analytics-dashboard table td strong{font-size:clamp(1rem,1.35vw,1.22rem)}
#content .analytics-dashboard .analytics-chart-value{font-size:clamp(1rem,1.5vw,1.3rem);font-weight:900}
@media (max-width:700px){
 #content .analytics-dashboard .card{padding:14px}
 #content .analytics-dashboard .grid.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
 #content .analytics-dashboard table{min-width:980px!important}
}
@media (max-width:430px){#content .analytics-dashboard .grid.cards{grid-template-columns:1fr}}

/* Global readability upgrade: larger responsive text and numerals on all internal pages */
html{font-size:clamp(16px,0.28vw + 15px,19px)}
body{font-size:1rem;line-height:1.55}
.main{padding:clamp(16px,2.2vw,32px)}
.topbar h2{font-size:clamp(1.45rem,2.1vw,2rem);font-weight:900}
.user-badge{font-size:clamp(.95rem,1.05vw,1.08rem);font-weight:700}
.nav button{font-size:clamp(.95rem,1vw,1.08rem);font-weight:700}

.card{padding:clamp(16px,1.5vw,22px)}
.card .muted,.muted{font-size:clamp(.92rem,1vw,1.05rem)}
.card .kpi{
  font-size:clamp(1.65rem,2.5vw,2.5rem)!important;
  font-weight:900;
  line-height:1.2;
  letter-spacing:.01em;
}
.small{font-size:clamp(.86rem,.9vw,.98rem)!important;line-height:1.5}
.section-title{font-size:clamp(1.15rem,1.4vw,1.4rem);font-weight:900}
.summary-row{gap:14px;align-items:center}
.summary-row strong{font-size:clamp(1.05rem,1.25vw,1.25rem);font-weight:900}

table{min-width:820px}
th,td{
  font-size:clamp(.98rem,1.05vw,1.12rem)!important;
  padding:clamp(12px,1vw,16px) clamp(12px,1.1vw,17px);
  line-height:1.5;
}
th{font-weight:900}
td strong{font-size:clamp(1rem,1.12vw,1.18rem)}
.status{font-size:clamp(.88rem,.92vw,1rem);padding:6px 10px}
.field label{font-size:clamp(.92rem,.98vw,1.04rem);font-weight:700}
.field input,.field select,.field textarea,input,select,textarea{
  font-size:clamp(1rem,1.05vw,1.12rem);
}
.btn,button{font-size:clamp(.94rem,1vw,1.06rem);font-weight:800}

/* Previously compact KPI cards were too small */
.compact-metrics .card{padding:clamp(14px,1.3vw,20px)}
.compact-metrics .card .kpi{
  font-size:clamp(1.45rem,2vw,2rem)!important;
  font-weight:900;
}
.compact-metrics .card .muted{font-size:clamp(.9rem,.95vw,1.02rem)}

/* Analytics remains prominent */
#content .analytics-number{font-size:clamp(1.2rem,1.7vw,1.6rem);font-weight:900}
#content .analytics-dashboard .kpi{font-size:clamp(1.8rem,3vw,2.8rem)!important}
#content .analytics-dashboard table td,
#content .analytics-dashboard table th{font-size:clamp(1rem,1.18vw,1.2rem)!important}
#content .analytics-dashboard .analytics-chart-value{font-size:clamp(1.15rem,1.7vw,1.55rem);font-weight:900}

@media (max-width:900px){
  html{font-size:16px}
  .main{padding:16px}

let sahalatCalendarState=null;
function closeSahalatCalendar(){
  document.getElementById('sahalatCalendarPopup')?.remove();
  sahalatCalendarState=null;
}
function openCustomDatePicker(el){
  const wrap=el?.closest?.('.custom-date-input');
  const input=wrap?.querySelector?.('.date-native');
  if(!input) return;
  closeSahalatCalendar();
  const selected=parseISODateParts(input.value) || (()=>{const n=new Date();return {y:n.getFullYear(),m:n.getMonth()+1,d:n.getDate()};})();
  sahalatCalendarState={input,wrap,year:selected.y,month:selected.m};
  const popup=document.createElement('div');
  popup.id='sahalatCalendarPopup';
  popup.className='sahalat-calendar';
  document.body.appendChild(popup);
  renderSahalatCalendar();
  const r=wrap.getBoundingClientRect();
  const pr=popup.getBoundingClientRect();
  let left=Math.min(Math.max(12,r.left),window.innerWidth-pr.width-12);
  let top=r.bottom+6;
  if(top+pr.height>window.innerHeight-12) top=Math.max(12,r.top-pr.height-6);
  popup.style.left=`${left}px`;
  popup.style.top=`${top}px`;
  setTimeout(()=>document.addEventListener('pointerdown',sahalatCalendarOutside,true),0);
}
function sahalatCalendarOutside(e){
  const popup=document.getElementById('sahalatCalendarPopup');
  if(!popup) return document.removeEventListener('pointerdown',sahalatCalendarOutside,true);
  if(popup.contains(e.target) || sahalatCalendarState?.wrap?.contains(e.target)) return;
  closeSahalatCalendar();
  document.removeEventListener('pointerdown',sahalatCalendarOutside,true);
}
function shiftSahalatCalendarMonth(delta){
  if(!sahalatCalendarState) return;
  let m=sahalatCalendarState.month+delta, y=sahalatCalendarState.year;
  if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  sahalatCalendarState.month=m; sahalatCalendarState.year=y;
  renderSahalatCalendar();
}
function selectSahalatCalendarDate(iso){
  const input=sahalatCalendarState?.input;
  if(!input) return;
  input.value=iso;
  input.dispatchEvent(new Event('change',{bubbles:true}));
  closeSahalatCalendar();
  document.removeEventListener('pointerdown',sahalatCalendarOutside,true);
}
function canManageUsers(){ return state.currentUser?.role === 'أدمن'; }

function calcLoan(amount, months, generalDiscount, userDiscount, adminDiscount, sharePercentages){
  // نحفظ الحساب الدقيق داخليًا، لكن العرض والسداد الدوري يكونان بالريال الصحيح فقط.
  const baseRate = RATES[months] || 0;
  const baseInterest = amount * baseRate/100;
  const afterGeneral = baseInterest * (1-generalDiscount/100);
  const userShare = Number(sharePercentages?.user ?? (state.userSharePercent||40)) / 100;
  const ownerShare = Number(sharePercentages?.owner ?? (state.ownerSharePercent||60)) / 100;
  const userGross = afterGeneral * userShare;
  const adminGross = afterGeneral * ownerShare;
  const userNet = userGross * (1-userDiscount/100);
  const adminNet = adminGross * (1-adminDiscount/100);
  const finalInterest = userNet + adminNet;
  const total = amount + finalInterest;

  // القسط الدوري بدون كسور: نأخذ الريال الصحيح.
  const installmentExact = months ? total/months : 0;
  const installment = whole(installmentExact);

  // مجموع الأقساط الصحيحة، ثم الفرق الحقيقي يذهب إلى مستحق التصفية الأخير.
  const scheduledWholePayments = installment * months;
  const settlementDue = Math.max(0, total - scheduledWholePayments);

  return {
    baseRate,baseInterest,afterGeneral,userGross,adminGross,userNet,adminNet,
    finalInterest,total,installmentExact,installment,scheduledWholePayments,settlementDue
  };
}



let arabicDigitObserver=null;
function disableArabicDigitRendering(){
  if(arabicDigitObserver){
    arabicDigitObserver.disconnect();
    arabicDigitObserver=null;
  }
}
function enableArabicDigitRendering(){
  if(state.lang!=='ar'){
    disableArabicDigitRendering();
    return;
  }
  if(arabicDigitObserver) return;
  const app=document.getElementById('app');
  if(!app) return;

  convertVisibleDigitsToArabic(app);

  arabicDigitObserver=new MutationObserver(mutations=>{
    // إذا تغيرت اللغة أثناء وجود المراقب فلا نلمس الأرقام الإنجليزية.
    if(state.lang!=='ar') return;
    mutations.forEach(m=>{
      if(m.type==='characterData'){
        const node=m.target;
        if(/[0-9]/.test(node.nodeValue||'')){
          const next=toArabicDigitsText(node.nodeValue);
          if(next!==node.nodeValue) node.nodeValue=next;
        }
      }else{
        m.addedNodes.forEach(node=>{
          if(node.nodeType===Node.TEXT_NODE){
            if(/[0-9]/.test(node.nodeValue||'')){
              node.nodeValue=toArabicDigitsText(node.nodeValue);
            }
          }else if(node.nodeType===Node.ELEMENT_NODE){
            convertVisibleDigitsToArabic(node);
          }
        });
      }
    });
  });

  arabicDigitObserver.observe(app,{
    subtree:true,
    childList:true,
    characterData:true
  });
}


let sarUnitObserver=null;
function disableEnglishSarStyling(){
  if(sarUnitObserver){
    sarUnitObserver.disconnect();
    sarUnitObserver=null;
  }
}
function enableEnglishSarStyling(){
  if(state.lang!=='en'){
    disableEnglishSarStyling();
    return;
  }
  if(sarUnitObserver) return;
  const app=document.getElementById('app');
  if(!app) return;
  styleEnglishSarUnits(app);
  sarUnitObserver=new MutationObserver(mutations=>{
    if(state.lang!=='en') return;
    mutations.forEach(m=>{
      if(m.type==='characterData'){
        const node=m.target;
        if(/\bSAR\b/.test(node.nodeValue||'')) styleEnglishSarUnits(node.parentElement);
      }else{
        m.addedNodes.forEach(node=>{
          if(node.nodeType===Node.TEXT_NODE){
            if(/\bSAR\b/.test(node.nodeValue||'')) styleEnglishSarUnits(node.parentElement);
          }else if(node.nodeType===Node.ELEMENT_NODE && !node.classList.contains('sar-unit')){
            styleEnglishSarUnits(node);
          }
        });
      }
    });
  });
  sarUnitObserver.observe(app,{subtree:true,childList:true,characterData:true});
}


function render(){
  const app = document.getElementById('app');
  if(state.isBootstrapping) return;
  applyLanguageDocument();
  if(state.lang==='en') disableArabicDigitRendering();
  else disableEnglishSarStyling();
  if(!state.currentUser){
    app.innerHTML = loginView();
    bindLogin();
    bindLanguageSwitch();
    if(state.lang==='ar'){
      enableArabicDigitRendering();
      convertVisibleDigitsToArabic(app);
    }else{
      enableEnglishSarStyling();
      styleEnglishSarUnits(app);
    }
    return;
  }
  app.innerHTML = shellView();
  bindNav();
  bindLanguageSwitch();
  renderPage();
  if(state.lang==='ar'){
    enableArabicDigitRendering();
    convertVisibleDigitsToArabic(app);
  }else{
    enableEnglishSarStyling();
    styleEnglishSarUnits(app);
  }
}

function bindLogin(){
  const username=document.getElementById('loginUsername');
  const password=document.getElementById('password');
  const button=document.getElementById('loginBtn');
  const errorBox=document.getElementById('loginError');

  const reloadUsers=document.getElementById('reloadLoginUsersBtn');
  if(reloadUsers) reloadUsers.onclick=async()=>{
    reloadUsers.disabled=true;
    reloadUsers.textContent=t('loading');
    try{
      const {data,error}=await supabaseClient.rpc('get_login_users');
      if(error) throw error;
      state.loginUsers=(data||[]).filter(x=>x?.username&&x?.email).map(x=>({
        username:String(x.username),
        email:String(x.email)
      }));
      state.connectionError='';
      render();
    }catch(e){
      console.error(e);
      state.connectionError=t('loadUsersFailed')+' '+(e?.message||t('unknownError'));
      render();
    }
  };

  const submit=async()=>{
    const e=username.value;
    const p=password.value;

    errorBox.textContent='';
    if(!e || !p){
      errorBox.textContent=t('loginRequired');
      return;
    }

    button.disabled=true;
    button.textContent=t('loggingIn');

    try{
      const {data,error}=await supabaseClient.auth.signInWithPassword({
        email:e,
        password:p
      });

      if(error) throw error;
      if(!data?.user) throw new Error('تعذر قراءة حساب المستخدم بعد تسجيل الدخول.');

      state.authSession=data.session;
      state.authUser=data.user;
      await loadCurrentProfile(data.user);
      state.page='dashboard';
      state.connectionError='';
      render();
    }catch(err){
      console.error(err);
      await supabaseClient.auth.signOut().catch(()=>{});
      state.currentUser=null;
      state.authSession=null;
      state.authUser=null;
      errorBox.textContent=err?.message||t('loginFailed');
    }finally{
      button.disabled=false;
      button.textContent=t('login');
    }
  };

  button.onclick=submit;
  password.addEventListener('keydown',e=>{
    if(e.key==='Enter') submit();
  });
  username.addEventListener('keydown',e=>{
    if(e.key==='Enter') submit();
  });
}

function renderPage(){
  const c = document.getElementById('content');

function visibleLoansForCurrentUser(){
  if(['أدمن','مدير مشروع','مدير المشروع'].includes(state.currentUser.role)) return state.loans;
  return state.loans.filter(l=>{
    const assigned=(l.assignedUser||l.createdBy);
    if(assigned!==state.currentUser.username) return false;
    if(l.status==='نشط' || l.status==='مغلق') return true;
    if(l.status.includes('بانتظار') && l.createdBy===state.currentUser.username) return true;
    return false;
  });

function currentCollectionYearExpectedInterest(userId){
  const today=new Date();
  const currentYear=(state.collectionYears||[]).find(y=>{
    if(!y?.startDate || !y?.endDate) return false;
    const start=new Date(y.startDate+'T00:00:00');
    const end=new Date(y.endDate+'T23:59:59');
    return today>=start && today<=end;
  });

  if(!currentYear){
    return {collectionYear:null,userShare:0,ownerShare:0,totalInterest:0};
  }

  const row=(state.expectedInterestByCollectionYear||[]).find(r=>
    String(r.userId||'')===String(userId||'') &&
    Number(r.collectionYear)===Number(currentYear.year)
  );

  return {
    collectionYear:currentYear.year,
    userShare:Number(row?.userShare||0),
    ownerShare:Number(row?.ownerShare||0),
    totalInterest:Number(row?.totalInterest||0)
  };
}

function currentCollectionWindow(){
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const day=today.getDate();

  // دورة التحصيل الشهرية المعتمدة: من 26 إلى 5 من الشهر التالي.
  if(day>=26){
    return {
      start:new Date(today.getFullYear(),today.getMonth(),26),
      end:new Date(today.getFullYear(),today.getMonth()+1,5)
    };
  }
  if(day<=5){
    return {
      start:new Date(today.getFullYear(),today.getMonth()-1,26),
      end:new Date(today.getFullYear(),today.getMonth(),5)
    };
  }
  return null;
}

function hasPaymentInCurrentCollectionWindow(loan){
  const window=currentCollectionWindow();
  if(!window) return false;

  return (loan.payments||[]).some(p=>{
    const raw=p.date||p.paymentDate||p.payment_date;
    if(!raw) return false;

    // Parse Gregorian YYYY-MM-DD locally to avoid timezone date shifts.
    const m=String(raw).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(!m) return false;
    const paymentDate=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
    return paymentDate>=window.start && paymentDate<=window.end;
  });
}

function bindLoanFilters(){
  const creator=document.getElementById('loanCreatorFilter');
  const type=document.getElementById('loanTypeFilter');
  const clear=document.getElementById('clearLoanFilters');
  const summary=document.getElementById('loanFilterSummary');
  if(!creator||!type) return;

  const apply=()=>{
    const creatorValue=creator.value;
    const typeValue=type.value;
    const allRows=[...document.querySelectorAll('tr[data-loan-id]')];

    let shown=0;
    const sectionCounts={active:0,other:0,closed:0};

    allRows.forEach(row=>{
      const okCreator=!creatorValue || row.dataset.loanCreator===creatorValue;
      const okType=!typeValue || row.dataset.loanType===typeValue;
      const visible=okCreator&&okType;
      row.style.display=visible?'':'none';
      if(visible){
        shown++;
        if(row.closest('#activeLoansBody')) sectionCounts.active++;
        else if(row.closest('#otherLoansBody')) sectionCounts.other++;
        else if(row.closest('#closedLoansBody')) sectionCounts.closed++;
      }
    });

    const activeCount=document.getElementById('activeLoansCount');
    const otherCount=document.getElementById('otherLoansCount');
    const closedCount=document.getElementById('closedLoansCount');
    if(activeCount) activeCount.textContent=`(${sectionCounts.active})`;
    if(otherCount) otherCount.textContent=`(${sectionCounts.other})`;
    if(closedCount) closedCount.textContent=`(${sectionCounts.closed})`;

    const total=allRows.length;
    summary.textContent=(creatorValue||typeValue)
      ? `النتائج المطابقة: ${shown} من ${total} قرض`
      : `${tx('عرض جميع القروض:','Showing all loans:')} ${total}`;
  };

  creator.addEventListener('change',apply);
  type.addEventListener('change',apply);
  clear.onclick=()=>{
    creator.value='';
    type.value='';
    apply();
  };
}

function refreshApprovalCalculation(){
  const l=state.loans.find(x=>x.id===state.selectedLoanId);
  const input=document.getElementById('approvalAdminDiscount');
  if(!l || !input) return null;

  const ad=Number(input.value);
  if(!Number.isFinite(ad) || ad<0 || ad>100) return null;

  const r=calcLoan(
    Number(l.amount||0),
    Number(l.months||0),
    Number(l.generalDiscount||0),
    Number(l.userDiscount||0),
    ad
  );

  document.getElementById('apBaseRate').textContent=percentDisplay(r.baseRate);
  document.getElementById('apUserNet').textContent=wholeMoney(r.userNet);
  document.getElementById('apAdminNet').textContent=wholeMoney(r.adminNet);
  document.getElementById('apFinalInterest').textContent=wholeMoney(r.finalInterest);
  document.getElementById('apTotal').textContent=money(r.total);
  document.getElementById('apInstallment').textContent=wholeMoney(r.installment);
  document.getElementById('apSettlement').textContent=money(r.settlementDue);
  return {r, ad};
}

function bindLoanApproval(){
  const back=document.getElementById('approvalBackBtn');
  if(back) back.onclick=()=>{state.page='loans';render();};

  const input=document.getElementById('approvalAdminDiscount');
  if(input) input.oninput=refreshApprovalCalculation;

  const approve=document.getElementById('approveLoanFinalBtn');
  if(approve) approve.onclick=async()=>{
    const l=state.loans.find(x=>x.id===state.selectedLoanId);
    const calc=refreshApprovalCalculation();
    const err=document.getElementById('approvalError');

    if(err) err.textContent='';

    if(!l || !l.status.includes('بانتظار')){
      if(err) err.textContent='هذا القرض لم يعد بانتظار الاعتماد.';
      return;
    }
    if(!l.dbId){
      if(err) err.textContent='معرّف القرض في قاعدة البيانات غير متوفر.';
      return;
    }
    if(!calc){
      if(err) err.textContent='نسبة خصم الأدمن يجب أن تكون بين 0 و100%.';
      return;
    }

    const {ad}=calc;
    approve.disabled=true;
    const rejectBtn=document.getElementById('rejectLoanFinalBtn');
    if(rejectBtn) rejectBtn.disabled=true;
    approve.textContent='جاري الاعتماد...';

    try{
      const {error}=await supabaseClient.rpc('approve_loan',{
        p_loan_id:l.dbId,
        p_admin_discount:ad
      });

      if(error) throw error;

      await loadLoansFromDatabase();
      state.page='loans';
      render();
    }catch(e){
      console.error(e);
      if(err) err.textContent=e?.message||'تعذر اعتماد القرض.';
      approve.disabled=false;
      approve.textContent='اعتماد القرض';
      if(rejectBtn) rejectBtn.disabled=false;
    }
  };

  const reject=document.getElementById('rejectLoanFinalBtn');
  if(reject) reject.onclick=async()=>{
    const l=state.loans.find(x=>x.id===state.selectedLoanId);
    const err=document.getElementById('approvalError');
    const reason=document.getElementById('approvalRejectReason')?.value.trim()||'';

    if(err) err.textContent='';

    if(!l || !l.status.includes('بانتظار')){
      if(err) err.textContent='هذا القرض لم يعد بانتظار مراجعة الأدمن.';
      return;
    }
    if(!l.dbId){
      if(err) err.textContent='معرّف القرض في قاعدة البيانات غير متوفر.';
      return;
    }
    if(!reason){
      if(err) err.textContent='سبب رفض القرض مطلوب.';
      return;
    }

    reject.disabled=true;
    const approveBtn=document.getElementById('approveLoanFinalBtn');
    if(approveBtn) approveBtn.disabled=true;
    reject.textContent='جاري الرفض...';

    try{
      const {error}=await supabaseClient.rpc('reject_loan',{
        p_loan_id:l.dbId,
        p_reason:reason
      });

      if(error) throw error;

      await loadLoansFromDatabase();
      state.page='loans';
      render();
    }catch(e){
      console.error(e);
      if(err) err.textContent=e?.message||'تعذر رفض القرض.';
      reject.disabled=false;
      reject.textContent='رفض القرض';
      if(approveBtn) approveBtn.disabled=false;
    }
  };
}




function calcRepaymentPeriodLoan(loan, months){
  // Repayment reviews retain the share policy effective on the loan issue date.
  const issueDate = String(loan.loanDate||'').slice(0,10);
  const shares = /^\d{4}-\d{2}-\d{2}$/.test(issueDate)
    ? (issueDate < '2026-01-12' ? {user:50,owner:50} : {user:40,owner:60})
    : undefined;
  return calcLoan(
    Number(loan.amount||0), months,
    Number(loan.generalDiscount||0),
    Number(loan.userDiscount||0),
    Number(loan.adminDiscount||0), shares
  );
}

function calculateRepaymentPeriodPreview(){
  const l=state.loans.find(x=>x.id===state.selectedLoanId);
  const input=document.getElementById('repaymentNewMonths');
  if(!l || !input) return null;

  const newMonths=Number(input.value);
  if(!Number.isInteger(newMonths) || newMonths<1 || newMonths>state.maxMonths) return null;

  const r=calcRepaymentPeriodLoan(l,newMonths);

  const paid=Number(l.paid||0);
  const newRemaining=Math.max(0,r.total-paid);

  const a=document.getElementById('rpNewTotal');
  const b=document.getElementById('rpNewRemaining');
  const c=document.getElementById('rpNewInstallment');
  const d=document.getElementById('rpNewSettlement');
  if(a) a.textContent=money(r.total);
  if(b) b.textContent=money(newRemaining);
  if(c) c.textContent=wholeMoney(r.installment);
  if(d) d.textContent=money(r.settlementDue);

  return {newMonths,r,paid,newRemaining};
}

function bindRepaymentPeriodRequest(){
  const back=()=>{state.page='loan-details';render();};

  document.getElementById('repaymentBackBtn')?.addEventListener('click',back);
  document.getElementById('cancelRepaymentReviewBtn')?.addEventListener('click',back);

  const input=document.getElementById('repaymentNewMonths');
  if(input) input.oninput=calculateRepaymentPeriodPreview;

  const submit=document.getElementById('submitRepaymentReviewBtn');
  if(submit) submit.onclick=async()=>{
    const l=state.loans.find(x=>x.id===state.selectedLoanId);
    const err=document.getElementById('repaymentError');
    if(err) err.textContent='';

    if(!l || l.status!=='نشط'){
      if(err) err.textContent=tx('القرض غير صالح لمراجعة فترة السداد.','This loan is not eligible for repayment-period review.');
      return;
    }
    if(!l.dbId){
      if(err) err.textContent='معرّف القرض في قاعدة البيانات غير متوفر.';
      return;
    }
    if(l.earlySettlementRequest){
      if(err) err.textContent='يوجد طلب قائم بالفعل بانتظار موافقة الأدمن.';
      return;
    }

    const newMonths=Number(document.getElementById('repaymentNewMonths')?.value);
    if(!Number.isInteger(newMonths) || newMonths<1 || newMonths>state.maxMonths){
      if(err) err.textContent=`عدد الشهور يجب أن يكون رقمًا صحيحًا بين 1 و${state.maxMonths}.`;
      return;
    }

    submit.disabled=true;
    submit.textContent='جاري إرسال الطلب...';

    try{
      const {error}=await supabaseClient.rpc('create_repayment_period_request',{
        p_loan_id:l.dbId,
        p_requested_months:newMonths
      });

      if(error) throw error;

      await loadRepaymentRequestsFromDatabase();
      state.page='loan-details';
      render();
    }catch(e){
      console.error(e);
      if(err) err.textContent=e?.message||tx('تعذر إرسال طلب مراجعة فترة السداد.','Unable to submit repayment-period review request.');
      submit.disabled=false;
      submit.textContent='إرسال طلب المراجعة';
    }
  };

  calculateRepaymentPeriodPreview();
}

function createEarlySettlementRequest(loanId){
  if(state.currentUser.role==='أدمن'){
    alert(tx('الأدمن لا ينشئ طلبات مراجعة فترة السداد.','Admin cannot create repayment-period review requests.'));
    return;
  }

  const l=state.loans.find(x=>x.id===loanId);
  if(!l || l.status!=='نشط') return;
  if(l.earlySettlementRequest){
    alert(tx('يوجد بالفعل طلب مراجعة فترة السداد بانتظار موافقة الأدمن.','A repayment-period review request is already awaiting admin approval.'));
    return;
  }

  const raw = prompt(
    `مراجعة فترة السداد للقرض ${l.id}
عدد الشهور الحالي: ${l.months}
المدفوع حتى الآن: ${money(Number(l.paid||0))}

أدخل عدد الشهور الجديد:`,
    String(l.months)
  );
  if(raw===null) return;

  const newMonths = Number(raw);
  if(!Number.isInteger(newMonths) || newMonths<1 || newMonths>state.maxMonths){
    alert(`عدد الشهور يجب أن يكون رقمًا صحيحًا بين 1 و${state.maxMonths}.`);
    return;
  }

  const r = calcRepaymentPeriodLoan(l,newMonths);

  const paid = Number(l.paid||0);
  const newRemaining = Math.max(0, r.total - paid);

  l.earlySettlementRequest = {
    status:'بانتظار موافقة الأدمن',
    requestedMonths:newMonths,
    requestedBy:state.currentUser.username,
    requestedAt:new Date().toISOString(),
    oldMonths:Number(l.months||0),
    oldTotal:Number(l.total||0),
    oldInstallment:Number(l.installment||0),
    oldSettlementDue:Number(l.settlementDue||0),
    paidAtRequest:paid,
    newBaseRate:r.baseRate,
    newBaseInterest:r.baseInterest,
    newAfterGeneral:r.afterGeneral,
    newUserNet:r.userNet,
    newAdminNet:r.adminNet,
    newFinalInterest:r.finalInterest,
    newTotal:r.total,
    newInstallment:r.installment,
    newSettlementDue:r.settlementDue,
    newRemaining
  };

  alert(
    `تم إنشاء طلب سداد مبكر بانتظار موافقة الأدمن.

المدة الجديدة: ${newMonths} شهر
الإجمالي الجديد: ${money(r.total)}
المدفوع السابق: ${money(paid)}
المتبقي الجديد: ${money(newRemaining)}
القسط الجديد: ${wholeMoney(r.installment)}
مستحق التصفية: ${money(r.settlementDue)}`
  );
  render();
}

function approveRepaymentPeriodRequest(loanId){
  if(state.currentUser.role!=='أدمن') return;
  const l=state.loans.find(x=>x.id===loanId);
  const req=l?.earlySettlementRequest;
  if(!l || !req) return;

  const ok = confirm(
    `اعتماد طلب مراجعة فترة السداد للقرض ${l.id}

طلبه: ${req.requestedBy}
المدة القديمة: ${req.oldMonths} شهر
المدة الجديدة: ${req.requestedMonths} شهر
الإجمالي القديم: ${money(req.oldTotal)}
الإجمالي الجديد: ${money(req.newTotal)}
المدفوع حتى الطلب: ${money(req.paidAtRequest)}
المتبقي الجديد: ${money(req.newRemaining)}
القسط الجديد: ${wholeMoney(req.newInstallment)}
مستحق التصفية الجديد: ${money(req.newSettlementDue)}`
  );
  if(!ok) return;

  l.earlySettlementHistory = l.earlySettlementHistory || [];
  const record = {
    ...req,
    status:'معتمد',
    reviewedBy:state.currentUser.username,
    reviewedAt:new Date().toISOString()
  };
  l.earlySettlementHistory.push(record);
  l.lastRepaymentPeriodReview = record;

  l.months=req.requestedMonths;
  l.baseRate=req.newBaseRate;
  l.baseInterest=req.newBaseInterest;
  l.afterGeneral=req.newAfterGeneral;
  l.userNet=req.newUserNet;
  l.adminNet=req.newAdminNet;
  l.finalInterest=req.newFinalInterest;
  l.total=req.newTotal;
  l.installment=req.newInstallment;
  l.settlementDue=req.newSettlementDue;

  if(Number(l.paid||0) >= Number(l.total||0)){
    l.paid=Number(l.total||0);
    l.status='مغلق';
    l.closedBy=state.currentUser.username;
    l.closedAt=new Date().toISOString();
  }

  delete l.earlySettlementRequest;
  render();
}

function rejectRepaymentPeriodRequest(loanId){
  if(state.currentUser.role!=='أدمن') return;
  const l=state.loans.find(x=>x.id===loanId);
  const req=l?.earlySettlementRequest;
  if(!l || !req) return;

  const reason = prompt('سبب رفض طلب مراجعة فترة السداد:','') || '';
  if(!confirm(`تأكيد رفض طلب مراجعة فترة السداد للقرض ${l.id}؟`)) return;

  l.earlySettlementHistory = l.earlySettlementHistory || [];
  const record = {
    ...req,
    status:'مرفوض',
    rejectionReason:reason,
    reviewedBy:state.currentUser.username,
    reviewedAt:new Date().toISOString()
  };
  l.earlySettlementHistory.push(record);
  l.lastRepaymentPeriodReview = record;
  delete l.earlySettlementRequest;
  render();
}

function reviewEarlySettlementRequest(loanId){
  approveRepaymentPeriodRequest(loanId);
}

function bindRepaymentPeriodAdminReview(){
  const back=()=>{
    state.page='early-reviews';
    render();
  };

  document.getElementById('adminRepaymentBackBtn')?.addEventListener('click',back);

  const approve=document.getElementById('approveRepaymentPeriodBtn');
  if(approve) approve.onclick=async()=>{
    const r=(state.repaymentRequests||[]).find(x=>x.id===state.selectedRepaymentRequestId);
    const err=document.getElementById('adminRepaymentError');
    const note=document.getElementById('adminRepaymentNote')?.value||'';

    if(err) err.textContent='';
    if(!r){
      if(err) err.textContent='طلب المراجعة غير موجود.';
      return;
    }

    approve.disabled=true;
    const rejectBtn=document.getElementById('rejectRepaymentPeriodBtn');
    if(rejectBtn) rejectBtn.disabled=true;
    approve.textContent='جاري الاعتماد...';

    try{
      const {error}=await supabaseClient.rpc('approve_repayment_period_request',{
        p_request_id:r.dbId,
        p_review_note:note||null
      });
      if(error) throw error;

      await loadLoansFromDatabase();
      await loadRepaymentRequestsFromDatabase();

      state.selectedRepaymentRequestId=null;
      state.page='early-reviews';
      render();
    }catch(e){
      console.error(e);
      if(err) err.textContent=e?.message||tx('تعذر اعتماد مراجعة فترة السداد.','Unable to approve repayment-period review.');
      approve.disabled=false;
      approve.textContent='اعتماد التغيير';
      if(rejectBtn) rejectBtn.disabled=false;
    }
  };

  const reject=document.getElementById('rejectRepaymentPeriodBtn');
  if(reject) reject.onclick=async()=>{
    const r=(state.repaymentRequests||[]).find(x=>x.id===state.selectedRepaymentRequestId);
    const err=document.getElementById('adminRepaymentError');
    const note=document.getElementById('adminRepaymentNote')?.value?.trim()||'';

    if(err) err.textContent='';
    if(!r){
      if(err) err.textContent='طلب المراجعة غير موجود.';
      return;
    }
    if(!note){
      if(err) err.textContent='سبب الرفض مطلوب.';
      return;
    }

    reject.disabled=true;
    const approveBtn=document.getElementById('approveRepaymentPeriodBtn');
    if(approveBtn) approveBtn.disabled=true;
    reject.textContent='جاري الرفض...';

    try{
      const {error}=await supabaseClient.rpc('reject_repayment_period_request',{
        p_request_id:r.dbId,
        p_review_note:note
      });
      if(error) throw error;

      await loadRepaymentRequestsFromDatabase();

      state.selectedRepaymentRequestId=null;
      state.page='early-reviews';
      render();
    }catch(e){
      console.error(e);
      if(err) err.textContent=e?.message||tx('تعذر رفض مراجعة فترة السداد.','Unable to reject repayment-period review.');
      reject.disabled=false;
      reject.textContent='رفض التغيير';
      if(approveBtn) approveBtn.disabled=false;
    }
  };
}

function paymentActionDeadline(p){
  if(!p) return 0;
  const stamp=p.lastEditedAt || p.createdAt;
  return (stamp ? new Date(stamp).getTime() : 0) + 24*60*60*1000;
}

function privilegedPaymentActionDeadline(p){
  if(!p || !p.createdAt) return 0;
  // للأدمن والمدير: خمسة أيام من created_at الأصلي، والتعديل لا يجدد المهلة.
  return new Date(p.createdAt).getTime() + 5*24*60*60*1000;
}

function paymentActionWindowOpen(p){
  return !!p && Date.now() <= paymentActionDeadline(p);
}

function privilegedPaymentActionWindowOpen(p){
  return !!p && Date.now() <= privilegedPaymentActionDeadline(p);
}

function isPaymentPrivilegedRole(){
  return !!state.currentUser && ['أدمن','مدير مشروع','مدير المشروع'].includes(state.currentUser.role);
}

function lastActivePayment(l){
  if(!l || !Array.isArray(l.payments) || !l.payments.length) return null;
  return l.payments[l.payments.length-1];
}

function canModifyLastPayment(l,p){
  if(!l || !p || !state.currentUser) return false;

  // الأدمن ومدير المشروع: أي دفعة لأي مستخدم خلال 5 أيام من إنشائها،
  // بما في ذلك دفعات القروض التي أصبحت مغلقة/مسددة.
  if(isPaymentPrivilegedRole()) return privilegedPaymentActionWindowOpen(p);

  // المستخدم العادي: نفس القاعدة القديمة، آخر دفعة سجلها فقط وخلال 24 ساعة.
  const last=lastActivePayment(l);
  if(!last || last.id!==p.id) return false;
  if(p.createdById!==state.currentUser.id) return false;
  return paymentActionWindowOpen(p);
}


function appendPaymentAudit(l,entry){
  if(!Array.isArray(l.paymentAuditLog)) l.paymentAuditLog=[];
  l.paymentAuditLog.push({
    ...entry,
    actionBy:state.currentUser.username,
    actionAt:new Date().toISOString()
  });
}

function editLastPayment(loanId,paymentId,newAmount,newDate,newNote,reason){
  const l=state.loans.find(x=>x.id===loanId);
  const p=l?.payments?.find(x=>x.id===paymentId);
  if(!l || !p) return {ok:false,msg:'الدفعة غير موجودة.'};
  if(!canModifyLastPayment(l,p)){
    return {ok:false,msg:isPaymentPrivilegedRole()
      ? 'انتهت مهلة الخمسة أيام لتعديل هذه الدفعة.'
      : (paymentActionWindowOpen(p)
          ? 'يمكن تعديل آخر دفعة فقط بواسطة المستخدم الذي سجلها.'
          : 'انتهت مهلة تعديل الدفعة بعد مرور 24 ساعة.')};
  }
  if(!Number.isFinite(newAmount) || newAmount<=0) return {ok:false,msg:'مبلغ الدفعة غير صحيح.'};
  if(!newDate) return {ok:false,msg:'تاريخ الدفعة مطلوب.'};
  if(!reason || !reason.trim()) return {ok:false,msg:'سبب التعديل مطلوب.'};

  const oldAmount=Number(p.amount||0);
  const oldPaid=Number(l.paid||0);
  const newPaid=oldPaid-oldAmount+newAmount;
  if(newPaid<0) return {ok:false,msg:'قيمة المدفوع الناتجة غير صحيحة.'};
  if(newPaid>Number(l.total||0)) return {ok:false,msg:'مجموع الدفعات بعد التعديل أكبر من إجمالي السداد.'};

  appendPaymentAudit(l,{
    action:'تعديل دفعة',
    paymentId:p.id,
    oldAmount,
    newAmount,
    oldDate:p.paymentDate||'',
    newDate,
    oldNote:p.note||'',
    newNote:newNote||'',
    reason:reason.trim()
  });

  p.amount=newAmount;
  p.paymentDate=newDate;
  p.note=newNote||'';
  p.lastEditedBy=state.currentUser.username;
  p.lastEditedAt=new Date().toISOString();
  p.lastEditReason=reason.trim();

  l.paid=newPaid;

  if(l.paid>=Number(l.total||0)-0.000001){
    l.paid=Number(l.total||0);
    l.status='مغلق';
    l.closedBy=state.currentUser.username;
    l.closedAt=new Date().toISOString();
  }else if(l.status==='مغلق'){
    l.status='نشط';
    delete l.closedBy;
    delete l.closedAt;
  }

  return {ok:true};
}

function deleteLastPayment(loanId,paymentId,reason){
  const l=state.loans.find(x=>x.id===loanId);
  const p=l?.payments?.find(x=>x.id===paymentId);
  if(!l || !p) return {ok:false,msg:'الدفعة غير موجودة.'};
  if(!canModifyLastPayment(l,p)){
    return {ok:false,msg:isPaymentPrivilegedRole()
      ? 'انتهت مهلة الخمسة أيام لحذف هذه الدفعة.'
      : (paymentActionWindowOpen(p)
          ? 'يمكن حذف آخر دفعة فقط بواسطة المستخدم الذي سجلها.'
          : 'انتهت مهلة حذف الدفعة بعد مرور 24 ساعة.')};
  }
  if(!reason || !reason.trim()) return {ok:false,msg:'سبب الحذف مطلوب.'};

  appendPaymentAudit(l,{
    action:'حذف دفعة',
    paymentId:p.id,
    oldAmount:Number(p.amount||0),
    oldDate:p.paymentDate||'',
    oldNote:p.note||'',
    reason:reason.trim()
  });

  l.paid=Math.max(0,Number(l.paid||0)-Number(p.amount||0));
  l.payments=l.payments.filter(x=>x.id!==p.id);

  if(l.status==='مغلق'){
    l.status='نشط';
    delete l.closedBy;
    delete l.closedAt;
  }

  return {ok:true};
}


function bindPaymentAction(){
  const back=()=>{state.page='loan-details';render();};
  document.getElementById('paymentActionBackBtn')?.addEventListener('click',back);
  document.getElementById('cancelPaymentActionBtn')?.addEventListener('click',back);

  const confirmBtn=document.getElementById('confirmPaymentActionBtn');
  if(confirmBtn) confirmBtn.onclick=async()=>{
    const l=state.loans.find(x=>x.id===state.selectedLoanId);
    const p=l?.payments?.find(x=>x.id===state.selectedPaymentId);
    const err=document.getElementById('paymentActionError');
    const reason=document.getElementById('paymentActionReason')?.value.trim()||'';

    if(err) err.textContent='';

    if(!l || !p){
      if(err) err.textContent='الدفعة غير موجودة.';
      return;
    }
    if(!p.dbId){
      if(err) err.textContent='معرّف الدفعة في قاعدة البيانات غير متوفر.';
      return;
    }
    if(!reason){
      if(err) err.textContent='سبب العملية مطلوب.';
      return;
    }

    confirmBtn.disabled=true;
    confirmBtn.textContent=state.paymentActionMode==='edit'?'جاري الحفظ...':'جاري الحذف...';

    try{
      if(state.paymentActionMode==='edit'){
        const amount=Number(document.getElementById('editPaymentAmount')?.value);
        const date=document.getElementById('editPaymentDate')?.value||'';
        const note=document.getElementById('editPaymentNote')?.value||'';

        if(!Number.isFinite(amount) || amount<=0){
          throw new Error('مبلغ الدفعة غير صحيح.');
        }
        if(!date){
          throw new Error('تاريخ الدفعة مطلوب.');
        }

        const {error}=await supabaseClient.rpc('edit_last_payment',{
          p_payment_id:p.dbId,
          p_new_amount:amount,
          p_new_payment_date:date,
          p_new_note:note||null,
          p_reason:reason
        });

        if(error) throw error;

      }else{
        const {error}=await supabaseClient.rpc('delete_last_payment',{
          p_payment_id:p.dbId,
          p_reason:reason
        });

        if(error) throw error;
      }

      await loadLoansFromDatabase();

      state.selectedPaymentId=null;
      state.paymentActionMode=null;
      state.page='loan-details';
      render();

    }catch(e){
      console.error(e);
      if(err) err.textContent=e?.message||'تعذر تنفيذ العملية.';
      confirmBtn.disabled=false;
      confirmBtn.textContent=state.paymentActionMode==='edit'?'حفظ التعديل':'تأكيد الحذف';
    }
  };
}


function bindRecordPayment(){
  const back=()=>{state.page='loan-details';render();};

  const backBtn=document.getElementById('paymentBackBtn');
  if(backBtn) backBtn.onclick=back;

  const cancel=document.getElementById('cancelPaymentBtn');
  if(cancel) cancel.onclick=back;

  const save=document.getElementById('savePaymentBtn');
  if(save) save.onclick=async()=>{
    const l=state.loans.find(x=>x.id===state.selectedLoanId);
    const err=document.getElementById('paymentError');
    if(err) err.textContent='';

    if(!l || l.status!=='نشط'){
      if(err) err.textContent='القرض غير صالح لتسجيل دفعة.';
      return;
    }

    if(state.currentUser.role==='أدمن'){
      if(err) err.textContent='الأدمن لا يستطيع تسجيل الدفعات.';
      return;
    }

    if(!l.dbId){
      if(err) err.textContent='معرّف القرض في قاعدة البيانات غير متوفر.';
      return;
    }

    const amount=Number(document.getElementById('paymentAmount').value);
    const date=document.getElementById('paymentDate').value;
    const note=document.getElementById('paymentNote').value.trim();

    const paid=Number(l.paid||0);
    const remaining=Math.max(0,Number(l.total||0)-paid);

    if(!Number.isFinite(amount) || amount<=0){
      if(err) err.textContent='مبلغ الدفعة غير صحيح.';
      return;
    }
    if(amount>remaining){
      if(err) err.textContent='مبلغ الدفعة أكبر من المتبقي على القرض.';
      return;
    }
    if(!date){
      if(err) err.textContent='تاريخ الدفعة مطلوب.';
      return;
    }

    save.disabled=true;
    save.textContent=tx('جاري الحفظ...','Saving...');

    try{
      const {error}=await supabaseClient.rpc('create_payment',{
        p_loan_id:l.dbId,
        p_amount:amount,
        p_payment_date:date,
        p_note:note||null
      });

      if(error) throw error;

      await loadLoansFromDatabase();
      state.page='loan-details';
      render();
    }catch(e){
      console.error(e);
      if(err) err.textContent=e?.message||'تعذر تسجيل الدفعة.';
      save.disabled=false;
      save.textContent='حفظ الدفعة';
    }
  };
}


function openPaymentDialog(loanId){
  if(state.currentUser.role==='أدمن'){
    alert('الأدمن لا يستطيع تسجيل الدفعات.');
    return;
  }
  const l=state.loans.find(x=>x.id===loanId);
  if(!l || l.status!=='نشط') return;

  const paid=Number(l.paid||0);
  const remaining=Math.max(0, Number(l.total||0)-paid);
  const suggested = remaining <= Number(l.installment||0) + Number(l.settlementDue||0)
    ? remaining
    : Number(l.installment||0);

  const raw = prompt(
    `تسجيل دفعة للقرض ${l.id}\nالمستفيد: ${l.beneficiary}\nالمدفوع: ${wholeMoney(paid)}\nالمتبقي: ${money(remaining)}\n\nأدخل مبلغ الدفعة بالريال:`,
    String(whole(suggested))
  );
  if(raw===null) return;

  const amount=Number(raw);
  if(!Number.isFinite(amount) || amount<=0){
    alert('مبلغ الدفعة غير صحيح.');
    return;
  }
  if(amount>remaining){
    alert('مبلغ الدفعة أكبر من المتبقي على القرض.');
    return;
  }

  const note = prompt('ملاحظة على الدفعة (اختياري):','') || '';
  if(!Array.isArray(l.payments)) l.payments=[];
  l.payments.push({
    id:'P-'+Date.now(),
    amount,
    note,
    createdBy:state.currentUser.username,
    createdAt:new Date().toISOString()
  });
  l.paid = paid + amount;

  const newRemaining=Math.max(0, Number(l.total||0)-l.paid);
  if(newRemaining<=0.000001){
    l.paid = Number(l.total||0);
    l.status='مغلق';
    l.closedBy=state.currentUser.username;

function analyticsLoanDate(l){
  if(l.loanDate) return new Date(l.loanDate+'T00:00:00');
  if(l.createdAt) return new Date(l.createdAt);

function collectionYearDateRange(row){
  if(!row?.startDate || !row?.endDate) return null;
  return {
    start:new Date(row.startDate+'T00:00:00'),
    end:new Date(row.endDate+'T23:59:59')
  };
}
function analyticsPeriods(mode){
  const today=new Date();
  const loanDates=state.loans
    .filter(l=>['active','closed'].includes(l.dbStatus))
    .map(analyticsLoanDate)
    .filter(Boolean);
  const earliest=loanDates.length?new Date(Math.min(...loanDates.map(d=>d.getTime()))):null;

  const years=(state.collectionYears||[]).filter(y=>{
    const r=collectionYearDateRange(y);
    if(!r) return false;
    if(r.start>today) return false;
    if(earliest && r.end<earliest) return false;
    return true;
  });

  const periods=[];
  years.forEach(y=>{
    const r=collectionYearDateRange(y);
    if(mode==='half'){
      const totalDays=Math.floor((r.end-r.start)/(24*60*60*1000))+1;
      const firstDays=Math.ceil(totalDays/2);
      const midEnd=new Date(r.start);
      midEnd.setDate(midEnd.getDate()+firstDays-1);
      const secondStart=new Date(midEnd);
      secondStart.setDate(secondStart.getDate()+1);
      periods.push({key:`${y.year}-H1`,label:`${arNum(y.year)} - ${tx('النصف الأول','First Half')}`,year:y.year,half:1,start:r.start,end:new Date(midEnd.getFullYear(),midEnd.getMonth(),midEnd.getDate(),23,59,59)});
      periods.push({key:`${y.year}-H2`,label:`${arNum(y.year)} - ${tx('النصف الثاني','Second Half')}`,year:y.year,half:2,start:new Date(secondStart.getFullYear(),secondStart.getMonth(),secondStart.getDate()),end:r.end});
    }else{
      periods.push({key:String(y.year),label:arNum(y.year),year:y.year,start:r.start,end:r.end});
    }
  });
  return periods;
}
function analyticsPeriodMatch(d,p,mode){
  if(!d || !p?.start || !p?.end) return false;
  return d>=p.start && d<=p.end;
}
function analyticsExpectedForUser(u){

function analyticsActualRecentForUser(u, months=6){

  return state.loans.filter(l=>l.assignedUserId===u.id && ['active','closed'].includes(l.dbStatus)).reduce((sum,l)=>sum+(l.payments||[]).reduce((s,p)=>{

    return s+(d&&d>=start?Number(p.amount||0):0);
  },0),0);
}
function analyticsEffectiveness(u){
  const m=getUserAccountMetrics(u.username); if(!m) return {score:0,collectionRate:0,closeRate:0,activity:0};
  const expected6=analyticsExpectedForUser(u)*6;
  const actual6=analyticsActualRecentForUser(u,6);
  const collectionRate=expected6>0?Math.min(150,(actual6/expected6)*100):(actual6>0?100:0);
  const closeRate=m.totalCount?m.closedCount/m.totalCount*100:0;
  const maxLoans=Math.max(1,...analyticsUsers().map(x=>getUserAccountMetrics(x.username)?.totalCount||0));

  // Main weight is actual collection versus expected collection, as agreed.
  const score=Math.min(100, collectionRate*.65 + closeRate*.20 + activity*.15);
  return {score,collectionRate,closeRate,activity,actual6,expected6};
}

function userCapitalMovementMetrics(user){
  const rows=activeCapitalMovements();
  let ownerToUser=0;

  let userToUserIn=0;
  let userToUserOut=0;

  rows.forEach(t=>{
    if(t.dbType==='owner_to_user' && t.toUserId===user.id) ownerToUser+=Number(t.amount||0);
    if(t.dbType==='user_to_owner' && t.fromUserId===user.id) userToOwner+=Number(t.amount||0);
    if(t.dbType==='user_to_user'){
      if(t.toUserId===user.id) userToUserIn+=Number(t.amount||0);
      if(t.fromUserId===user.id) userToUserOut+=Number(t.amount||0);
    }
  });

  return {ownerToUser,userToOwner,userToUserIn,userToUserOut};
}

function realizedRightsForLoan(l){
  const totalDue=Number(l.total||0);
  const principal=Number(l.amount||0);
  const paid=Math.min(Number(l.paid||0),totalDue);
  const finalInterest=Math.max(0,Number(l.finalInterest||0));

  if(totalDue<=0 || paid<=0 || finalInterest<=0){
    return {user:0,owner:0,realizedInterest:0};
  }

  // Interest is realized proportionally to actual cash collected.
  const realizedInterest=Math.min(finalInterest, finalInterest*(paid/totalDue));
  const userTarget=Math.max(0,Number(l.userNet||0));
  const ownerTarget=Math.max(0,Number(l.adminNet||0));
  const targetSum=userTarget+ownerTarget;

  if(targetSum<=0) return {user:0,owner:0,realizedInterest};

  return {
    user:realizedInterest*(userTarget/targetSum),
    owner:realizedInterest*(ownerTarget/targetSum),
    realizedInterest
  };
}

function getUserAccountMetrics(username){
  const u=state.users.find(x=>x.username===username);
  if(!u) return null;

  const approvedLoans=state.loans.filter(l=>
    l.assignedUserId===u.id &&
    ['active','closed'].includes(l.dbStatus)
  );
  const activeLoans=approvedLoans.filter(l=>l.dbStatus==='active');
  const closedLoans=approvedLoans.filter(l=>l.dbStatus==='closed');

  const totalLent=approvedLoans.reduce((s,l)=>s+Number(l.amount||0),0);
  const totalCollected=approvedLoans.reduce((s,l)=>s+Number(l.paid||0),0);
  const totalOutstanding=approvedLoans.reduce((s,l)=>s+Math.max(0,Number(l.total||0)-Number(l.paid||0)),0);
  const targetUserRight=approvedLoans.reduce((s,l)=>s+Number(l.userNet||0),0);
  const targetOwnerRight=approvedLoans.reduce((s,l)=>s+Number(l.adminNet||0),0);

  let realizedUserRight=0;
  let realizedOwnerRight=0;
  approvedLoans.forEach(l=>{
    const r=realizedRightsForLoan(l);
    realizedUserRight+=r.user;
    realizedOwnerRight+=r.owner;
  });

  const capital=userCapitalMovementMetrics(u);
  const baseCapital=Number(u.baseCapital||0);

  // base_capital is the live balance maintained by capital-movement DB functions.
  // Available bank balance also accounts for loan principal leaving and repayments returning.
  const transferredUser=Number(state.settlementTransferTotals[String(u.id)]?.user||0);
  const transferredOwner=Number(state.settlementTransferTotals[String(u.id)]?.owner||0);

  // Available bank balance =
  // base capital - total lent + total collected
  // - transferred to user - transferred to owner.
  const bankAfterCollection=baseCapital-totalLent+totalCollected-transferredUser-transferredOwner;

  const now=new Date();
  const y=now.getFullYear();
  const m=now.getMonth();

  const loanDateObj=l=>{
    if(l.loanDate) return new Date(l.loanDate+'T00:00:00');
    if(l.createdAt) return new Date(l.createdAt);
    return null;
  };

  const lentThisMonth=approvedLoans
    .filter(l=>{const d=loanDateObj(l);return d&&d.getFullYear()===y&&d.getMonth()===m;})
    .reduce((s,l)=>s+Number(l.amount||0),0);

  const lentThisYear=approvedLoans
    .filter(l=>{const d=loanDateObj(l);return d&&d.getFullYear()===y;})
    .reduce((s,l)=>s+Number(l.amount||0),0);

  let collectedThisMonth=0; // 6th current month through 25th next month
  let paymentCount=0;
  approvedLoans.forEach(l=>{
    (l.payments||[]).forEach(p=>{
      paymentCount++;
      const d=p.paymentDate ? new Date(p.paymentDate+'T00:00:00') : (p.createdAt?new Date(p.createdAt):null);
      if(d){
        const collectionStart=new Date(y,m,6);
        const collectionEnd=new Date(y,m+1,25,23,59,59,999);
        if(d>=collectionStart && d<=collectionEnd){
          collectedThisMonth+=Number(p.amount||0);
        }
      }
    });
  });

  const expectedMonthlyCollection=activeLoans.reduce((s,l)=>s+Number(l.installment||0),0);
  const remainingThisMonth=Math.max(0,expectedMonthlyCollection-collectedThisMonth);

  return {
    user:u,
    baseCapital,
    totalLent,
    totalCollected,
    totalOutstanding,
    targetUserRight,
    targetOwnerRight,
    realizedUserRight:Math.max(0, realizedUserRight - transferredUser),
    realizedOwnerRight:Math.max(0, realizedOwnerRight - transferredOwner),
    transferredUser,
    transferredOwner,
    transferredBetweenUsersOut:capital.userToUserOut,
    bankAfterCollection,
    activeCount:activeLoans.length,
    closedCount:closedLoans.length,
    totalCount:approvedLoans.length,
    paymentCount,
    expectedMonthlyCollection,
    remainingThisMonth,
    lentThisMonth,
    collectedThisMonth,
    lentThisYear,
    finalSettlementTotal:Math.max(0, totalLent + targetUserRight + targetOwnerRight - transferredUser - transferredOwner - totalCollected)
  };
}

function getAdminAggregateMetrics(){

  const activeLoans = allApprovedLoans.filter(l=>l.status==='نشط');
  const closedLoans = allApprovedLoans.filter(l=>l.status==='مغلق');

  const baseCapital = users.reduce((s,u)=>s+Number(u.baseCapital||0),0);
  const totalLent = allApprovedLoans.reduce((s,l)=>s+Number(l.amount||0),0);
  const totalCollected = allApprovedLoans.reduce((s,l)=>s+Number(l.paid||0),0);
  const targetUserRight = allApprovedLoans.reduce((s,l)=>s+Number(l.userNet||0),0);

    const paidMonthlyCount = Math.min(months, (l.payments||[]).length);
    realizedUserRight += (Number(l.userNet||0)/months) * paidMonthlyCount;
    realizedOwnerRight += (Number(l.adminNet||0)/months) * paidMonthlyCount;
  });

  const transferredUser = users.reduce((s,u)=>s+Number(u.transferredUser||0),0);
  const transferredOwner = users.reduce((s,u)=>s+Number(u.transferredOwner||0),0);

  const bankAfterCollection =
    baseCapital - totalLent + totalCollected - (transferredUser + transferredOwner);

  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();

  const loanDateObj = l => {
    if(l.loanDate) return new Date(l.loanDate+'T00:00:00');
    if(l.createdAt) return new Date(l.createdAt);
    return null;
  };

  const lentThisMonth = allApprovedLoans
    .filter(l=>{const d=loanDateObj(l); return d && d.getFullYear()===y && d.getMonth()===m;})
    .reduce((s,l)=>s+Number(l.amount||0),0);

  const lentThisYear = allApprovedLoans
    .filter(l=>{const d=loanDateObj(l); return d && d.getFullYear()===y;})
    .reduce((s,l)=>s+Number(l.amount||0),0);

  let collectedThisMonth = 0;
  allApprovedLoans.forEach(l=>{
    (l.payments||[]).forEach(p=>{
      const d=p.createdAt?new Date(p.createdAt):null;
      if(d && d.getFullYear()===y && d.getMonth()===m){
        collectedThisMonth += Number(p.amount||0);
      }
    });
  });

  const expectedMonthlyCollection = activeLoans.reduce((s,l)=>s+Number(l.installment||0),0);
  const remainingThisMonth = Math.max(0, expectedMonthlyCollection - collectedThisMonth);

  const finalSettlementTotal =
    baseCapital - totalCollected - (transferredUser + transferredOwner);

  return {
    user:{username:'admin', role:'أدمن'},
    baseCapital,totalLent,totalCollected,targetUserRight,targetOwnerRight,
    realizedUserRight,realizedOwnerRight,transferredUser,transferredOwner,
    bankAfterCollection,
    activeCount:activeLoans.length,
    closedCount:closedLoans.length,
    totalCount:allApprovedLoans.length,
    expectedMonthlyCollection,
    remainingThisMonth,
    lentThisMonth,
    collectedThisMonth,
    lentThisYear,
    finalSettlementTotal
  };
}

function fillCapitalRecipientOptions(){
  const type=document.getElementById('capitalTransferType');
  const from=document.getElementById('capitalFrom');
  const to=document.getElementById('capitalTo');
  if(type?.value!=='user-to-user' || !from || !to) return;
  const previous=to.value;
  const recipients=(state.capitalRecipientUsers||[]).filter(u=>u.username!==from.value);
  to.replaceChildren();
  for(const user of recipients){
    const option=document.createElement('option');
    option.value=user.username;
    option.textContent=user.username;
    to.appendChild(option);
  }
  if(recipients.some(u=>u.username===previous)) to.value=previous;
  if(!recipients.length){
    const option=document.createElement('option');
    option.value='';
    option.textContent=tx('لا يوجد مستلم متاح','No recipient available');
    to.appendChild(option);
  }
}

function fillCapitalPartyOptions(){
  const type=document.getElementById('capitalTransferType')?.value;
  const from=document.getElementById('capitalFrom');
  const to=document.getElementById('capitalTo');
  if(!from || !to) return;

  const allUsers=state.users.filter(u=>u.status==='نشط' && u.role!=='أدمن');
  const isOrdinary=state.currentUser.role==='مستخدم';
  const own=state.currentUser.username;
  const allOptions=allUsers.map(u=>`<option value="${u.username}">${u.username}</option>`).join('');

  if(type==='owner-to-user'){
    from.innerHTML=`<option value="${ownerLabel()}">${ownerDisplay()}</option>`;
    to.innerHTML=isOrdinary
      ? `<option value="${own}">${own}</option>`
      : allOptions;
    if(!isOrdinary && state.accountUser) to.value=state.accountUser;
  }else if(type==='user-to-owner'){
    from.innerHTML=isOrdinary
      ? `<option value="${own}">${own}</option>`
      : allOptions;
    if(!isOrdinary && state.accountUser) from.value=state.accountUser;
    to.innerHTML=`<option value="${ownerLabel()}">${ownerDisplay()}</option>`;
  }else{
    from.innerHTML=isOrdinary
      ? `<option value="${own}">${own}</option>`
      : allOptions;
    to.innerHTML=allOptions;
    if(!isOrdinary && state.accountUser) from.value=state.accountUser;
    fillCapitalRecipientOptions();
  }
}




function capitalActionDeadline(t){
  if(!t) return 0;
  const stamp=t.lastEditedAt || t.createdAt;
  const ms=stamp ? new Date(stamp).getTime() : 0;
  return ms + 24*60*60*1000;
}

function capitalActionWindowOpen(t){
  if(!t) return false;
  return Date.now() <= capitalActionDeadline(t);
}


function canEditCapitalTransfer(t){
  if(!t || t.entryKind!=='transfer' || t.status!=='active') return false;
  if(t.createdById!==state.currentUser.id) return false;
  return capitalActionWindowOpen(t);
}

async function editCapitalTransferDb(transferId,newAmount,newDate,newNote,reason){
  const t=(state.capitalTransfers||[]).find(x=>x.id===transferId);
  if(!t) return {ok:false,msg:'الحركة غير موجودة.'};
  if(!canEditCapitalTransfer(t)){
    return {ok:false,msg:capitalActionWindowOpen(t)
      ? 'يمكن تعديل الحركة فقط بواسطة المستخدم الذي أنشأها.'
      : 'انتهت مهلة تعديل الحركة بعد مرور 24 ساعة.'};
  }
  if(!Number.isFinite(newAmount) || newAmount<=0) return {ok:false,msg:'المبلغ الجديد غير صحيح.'};
  if(!newDate) return {ok:false,msg:'التاريخ مطلوب.'};
  if(!reason || !reason.trim()) return {ok:false,msg:'سبب التعديل مطلوب.'};

  const {error}=await supabaseClient.rpc('edit_capital_movement',{
    p_movement_id:t.dbId||t.id,
    p_new_amount:newAmount,
    p_new_movement_date:newDate,
    p_new_note:newNote||null,
    p_reason:reason.trim()
  });

  if(error) return {ok:false,msg:error.message||'تعذر تعديل الحركة.'};

  await loadVisibleUsers();
  if(!state.users.some(u=>u.id===state.currentUser.id)) state.users.unshift(state.currentUser);
  const refreshed=state.users.find(u=>u.id===state.currentUser.id);
  if(refreshed) state.currentUser={...state.currentUser,...refreshed};
  await loadCapitalMovementsFromDatabase();
  await loadCapitalHistoryFromDatabase();

  return {ok:true};
}


function canDeleteCapitalTransfer(t){
  if(!t || t.entryKind!=='transfer' || t.status!=='active') return false;
  if(t.createdById!==state.currentUser.id) return false;
  return capitalActionWindowOpen(t);
}

function reverseCapitalTransfer(t){
  const fromUser=state.users.find(u=>u.username===t.from);
  const toUser=state.users.find(u=>u.username===t.to);
  const amount=Number(t.amount||0);

  if(t.type==='owner-to-user'){
    if(!toUser) return {ok:false,msg:'المستخدم المستلم غير موجود.'};
    if(Number(toUser.baseCapital||0)<amount){
      return {ok:false,msg:'لا يمكن إلغاء الحركة لأن رأس مال المستخدم الحالي أقل من مبلغ الحركة.'};
    }
    toUser.baseCapital=Number(toUser.baseCapital||0)-amount;
    return {ok:true};
  }

  if(t.type==='user-to-owner'){
    if(!fromUser) return {ok:false,msg:'المستخدم المرسل غير موجود.'};
    fromUser.baseCapital=Number(fromUser.baseCapital||0)+amount;
    return {ok:true};
  }

  if(t.type==='user-to-user'){
    if(!fromUser || !toUser) return {ok:false,msg:'أحد المستخدمين غير موجود.'};
    if(Number(toUser.baseCapital||0)<amount){
      return {ok:false,msg:'لا يمكن إلغاء التحويل لأن رصيد المستخدم المستلم الحالي أقل من مبلغ التحويل.'};
    }
    toUser.baseCapital=Number(toUser.baseCapital||0)-amount;
    fromUser.baseCapital=Number(fromUser.baseCapital||0)+amount;
    return {ok:true};
  }

  return {ok:false,msg:'نوع الحركة غير معروف.'};
}

async function cancelCapitalTransferDb(transferId,reason){
  const t=(state.capitalTransfers||[]).find(x=>x.id===transferId);
  if(!t) return {ok:false,msg:'الحركة غير موجودة.'};
  if(!canDeleteCapitalTransfer(t)){
    return {ok:false,msg:capitalActionWindowOpen(t)
      ? 'يمكن إلغاء الحركة فقط بواسطة المستخدم الذي أنشأها.'
      : 'انتهت مهلة إلغاء الحركة بعد مرور 24 ساعة.'};
  }
  if(!reason || !reason.trim()) return {ok:false,msg:'سبب الإلغاء مطلوب.'};

  const {error}=await supabaseClient.rpc('cancel_capital_movement',{
    p_movement_id:t.dbId||t.id,
    p_reason:reason.trim()
  });

  if(error) return {ok:false,msg:error.message||'تعذر إلغاء الحركة.'};

  await loadVisibleUsers();
  if(!state.users.some(u=>u.id===state.currentUser.id)) state.users.unshift(state.currentUser);
  const refreshed=state.users.find(u=>u.id===state.currentUser.id);
  if(refreshed) state.currentUser={...state.currentUser,...refreshed};
  await loadCapitalMovementsFromDatabase();
  await loadCapitalHistoryFromDatabase();

  return {ok:true};
}


function bindCapitalTransfer(){
  state.capitalRecipientUsers=[];
  const back=()=>{state.page='accounts';render();};

  document.getElementById('capitalBackBtn')?.addEventListener('click',back);
  document.getElementById('cancelCapitalTransferBtn')?.addEventListener('click',back);

  fillCapitalPartyOptions();

  const recipientSelect=document.getElementById('capitalTo');
  const signedInUserId=state.currentUser.id;
  supabaseClient.rpc('get_capital_transfer_recipients').then(({data,error})=>{
    if(state.currentUser?.id!==signedInUserId || document.getElementById('capitalTo')!==recipientSelect) return;
    if(error) throw error;
    state.capitalRecipientUsers=(data||[]).map(u=>({id:u.id,username:u.username}));

  }).catch(error=>{
    if(state.currentUser?.id!==signedInUserId || document.getElementById('capitalTo')!==recipientSelect) return;
    const err=document.getElementById('capitalError');
    if(err) err.textContent=tx('تعذر تحميل أسماء المستلمين. تأكد من تثبيت تحديث Supabase ثم افتح الصفحة مجددًا.','Unable to load recipients. Install the Supabase update and reopen this page.');
    console.error(error);
  });

  document.querySelectorAll('.editCapitalTransferBtn').forEach(b=>b.onclick=()=>{
    const t=(state.capitalTransfers||[]).find(x=>x.id===b.dataset.id);
    if(!canEditCapitalTransfer(t)) return;
    state.pendingEditTransferId=t.id;
    state.pendingDeleteTransferId=null;
    render();
  });

  document.getElementById('cancelEditCapitalBtn')?.addEventListener('click',()=>{
    state.pendingEditTransferId=null;
    render();
  });

  document.getElementById('confirmEditCapitalBtn')?.addEventListener('click',async()=>{
    const amount=Number(document.getElementById('capitalEditAmount')?.value);
    const date=document.getElementById('capitalEditDate')?.value||'';
    const note=document.getElementById('capitalEditNote')?.value||'';
    const reason=document.getElementById('capitalEditReason')?.value||'';
    const err=document.getElementById('capitalEditError');
    if(err) err.textContent='';

    const btn=document.getElementById('confirmEditCapitalBtn');
    btn.disabled=true;
    btn.textContent='جاري الحفظ...';

    const result=await editCapitalTransferDb(state.pendingEditTransferId,amount,date,note,reason);
    if(!result.ok){
      if(err) err.textContent=result.msg;
      btn.disabled=false;
      btn.textContent='حفظ التعديل';
      return;
    }

    state.pendingEditTransferId=null;
    render();
  });

  document.querySelectorAll('.deleteCapitalTransferBtn').forEach(b=>b.onclick=()=>{
    const t=(state.capitalTransfers||[]).find(x=>x.id===b.dataset.id);
    if(!t) return;

    if(!canDeleteCapitalTransfer(t)){
      const err=document.getElementById('capitalError');
      if(err) err.textContent='يمكن حذف الحركة فقط بواسطة المستخدم الذي أنشأها.';
      return;
    }

    state.pendingDeleteTransferId=t.id;
    render();
  });

  const cancelDelete=document.getElementById('cancelDeleteCapitalBtn');
  if(cancelDelete) cancelDelete.onclick=()=>{
    state.pendingDeleteTransferId=null;
    render();
  };

  const confirmDelete=document.getElementById('confirmDeleteCapitalBtn');
  if(confirmDelete) confirmDelete.onclick=async()=>{
    const reason=document.getElementById('capitalDeleteReason')?.value||'';
    const err=document.getElementById('capitalDeleteError');
    if(err) err.textContent='';

    confirmDelete.disabled=true;
    confirmDelete.textContent='جاري الإلغاء...';

    const result=await cancelCapitalTransferDb(state.pendingDeleteTransferId,reason);

    if(!result.ok){
      if(err) err.textContent=result.msg;
      confirmDelete.disabled=false;
      confirmDelete.textContent='تأكيد الإلغاء';
      return;
    }

    state.pendingDeleteTransferId=null;
    render();
  };

  const save=document.getElementById('saveCapitalTransferBtn');
  if(save) save.onclick=async()=>{
    const err=document.getElementById('capitalError');
    if(err) err.textContent='';

    const typeVal=document.getElementById('capitalTransferType').value;
    const from=document.getElementById('capitalFrom').value;
    const to=document.getElementById('capitalTo').value;
    const amount=Number(document.getElementById('capitalAmount').value);
    const date=document.getElementById('capitalDate').value;
    const note=document.getElementById('capitalNote').value.trim();

    if(!Number.isFinite(amount) || amount<=0){
      if(err) err.textContent=tx('أدخل مبلغًا صحيحًا أكبر من صفر.','Enter a valid amount greater than zero.');
      return;
    }
    if(!date){
      if(err) err.textContent=tx('التاريخ مطلوب.','Date is required.');
      return;
    }
    if(from===to){
      if(err) err.textContent=tx('لا يمكن أن يكون الطرف المرسل والمستلم نفس الحساب.','The sender and recipient cannot be the same account.');
      return;
    }

    const fromUser=state.users.find(u=>u.username===from);
    const toUser=(typeVal==='user-to-user' ? (state.capitalRecipientUsers||[]) : state.users).find(u=>u.username===to);

    let dbType;
    let fromUserId=null;
    let toUserId=null;

    if(typeVal==='owner-to-user'){
      dbType='owner_to_user';
      if(!toUser){
        if(err) err.textContent=tx('المستخدم المستلم غير صحيح.','The recipient user is invalid.');
        return;
      }
      toUserId=toUser.id;

    }else if(typeVal==='user-to-owner'){
      dbType='user_to_owner';
      if(!fromUser){
        if(err) err.textContent=tx('المستخدم المرسل غير صحيح.','The sender user is invalid.');
        return;
      }
      fromUserId=fromUser.id;

    }else if(typeVal==='user-to-user'){
      dbType='user_to_user';
      if(!fromUser || !toUser){
        if(err) err.textContent=tx('أحد المستخدمين غير صحيح.','One of the selected users is invalid.');
        return;
      }
      fromUserId=fromUser.id;
      toUserId=toUser.id;

    }else{
      if(err) err.textContent=tx('نوع الحركة غير صحيح.','Invalid movement type.');
      return;
    }

    save.disabled=true;
    save.textContent='جاري التنفيذ...';

    try{
      const {error}=await supabaseClient.rpc('create_capital_movement',{
        p_movement_type:dbType,
        p_from_user_id:fromUserId,
        p_to_user_id:toUserId,
        p_amount:amount,
        p_movement_date:date,
        p_note:note||null
      });

      if(error) throw error;

      // Reload users first because base_capital changes in the database.
      await loadVisibleUsers();

      if(!state.users.some(u=>u.id===state.currentUser.id)){
        state.users.unshift(state.currentUser);
      }

      // Refresh the signed-in user's own profile so dashboard capital is current.
      const refreshedCurrent=state.users.find(u=>u.id===state.currentUser.id);
      if(refreshedCurrent){
        state.currentUser={...state.currentUser,...refreshedCurrent};
      }

      await loadCapitalMovementsFromDatabase();
      await loadCapitalHistoryFromDatabase();

      state.accountUser=state.currentUser.username;
      state.page='capital-movements';
      render();

    }catch(e){
      console.error(e);
      if(err) err.textContent=e?.message||'تعذر تنفيذ حركة رأس المال.';
      save.disabled=false;
      save.textContent='تنفيذ الحركة';
    }
  };
}


function capitalNameMatches(a,b){

}
