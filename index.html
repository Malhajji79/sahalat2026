    const note=document.getElementById('annualSettlementNote').value.trim();

    if(!Number.isFinite(amount)||amount<=0){err.textContent=tx('أدخل مبلغًا صحيحًا.','Enter a valid amount.');return;}
    if(!date){err.textContent=tx('التاريخ مطلوب.','Date is required.');return;}
    if(!receiver){err.textContent=tx('اسم المستلم مطلوب.','Receiver name is required.');return;}
    if(!deliveredBy){err.textContent=tx('اسم مسلّم المبلغ مطلوب.','Delivered-by name is required.');return;}

    save.disabled=true;
    save.textContent=tx('جاري الحفظ...','Saving...');

    try{
      const {error}=await supabaseClient.rpc('create_annual_settlement',{
        p_user_id:state.annualSettlementUserId,
        p_year:Number(date.slice(0,4)),
        p_settlement_for:settlementFor,
        p_amount:amount,
        p_settlement_date:date,
        p_receiver_name:receiver,
        p_delivered_by_name:deliveredBy,
        p_note:note||null
      });
      if(error) throw error;

      await loadAnnualSettlementData();
      render();
    }catch(e){
      console.error(e);
      err.textContent=e?.message||tx('تعذر حفظ التصفية.','Unable to save settlement.');
      save.disabled=false;
      save.textContent=tx('حفظ التصفية','Save Settlement');
    }
  };

  if(!state.annualSettlementSummary && state.annualSettlementUserId){
    loadAnnualSettlementData().then(()=>render()).catch(e=>console.error(e));
  }
}

async function invokeAdminUsers(body){
  const {data,error}=await supabaseClient.functions.invoke('admin-users',{body});
  if(error){
    let msg=error.message||tx('تعذر تنفيذ العملية.','Unable to complete the operation.');
    try{
      const ctx=error.context;
      if(ctx && typeof ctx.json==='function'){
        const payload=await ctx.json();
        if(payload?.error) msg=payload.error;
      }
    }catch(_){}
    throw new Error(msg);
  }
  if(data?.error) throw new Error(data.error);
  return data;
}

async function refreshAdminData(){
  await loadVisibleUsers();
  if(!state.users.some(u=>u.id===state.currentUser.id)) state.users.unshift(state.currentUser);
  const current=state.users.find(u=>u.id===state.currentUser.id);
  if(current) state.currentUser={...state.currentUser,...current};
  await loadLoansFromDatabase();
  await loadCapitalMovementsFromDatabase();
  await loadCapitalHistoryFromDatabase();
  await loadRepaymentRequestsFromDatabase();
  await loadCollectionYears();
  await loadExpectedInterestByCollectionYear();
}

function bindLoanForm(){
  const assigned=document.getElementById('assignedUser');
  if(assigned && state.currentUser.role==='مستخدم'){
    assigned.value=state.currentUser.username;
    assigned.disabled=true;
  }
  const ids=['loanType','generalDiscount','userDiscount','adminDiscount','amount','months'];
  ids.forEach(id=>document.getElementById(id).addEventListener('input',refreshLoanForm));
  document.getElementById('loanType').addEventListener('change',refreshLoanForm);
  document.getElementById('saveLoanBtn').onclick=saveLoan;
  refreshLoanForm();
}

function clampPct(v){v=Number(v||0);return Math.min(100,Math.max(0,v));}

function loanTypeToDb(type){
  return type==='قرض عادي' ? 'normal'
    : type==='قرض مجاني' ? 'free'
    : type==='قرض دراسة' ? 'study'
    : type==='قرض مكيفات' ? 'ac'
    : null;
}


function refreshLoanForm(){
  const type=document.getElementById('loanType').value;
  const gd=document.getElementById('generalDiscount');
  const ud=document.getElementById('userDiscount');
  const ad=document.getElementById('adminDiscount');

  if(type==='قرض عادي'){
    // الخصم العام ثابت 0%، بينما خصم المستخدم والأدمن قابلان للإدخال
    gd.value=0;
    gd.disabled=true;
    ud.disabled=false;
    ad.disabled=false;
  }else if(type==='قرض مجاني'){
    gd.value=100;ud.value=100;ad.value=100;
    gd.disabled=ud.disabled=ad.disabled=true;
  }else{
    gd.disabled=ud.disabled=ad.disabled=false;
  }

  const amount=Number(document.getElementById('amount').value||0);
  const months=Number(document.getElementById('months').value||0);
  const r=calcLoan(amount,months,clampPct(gd.value),clampPct(ud.value),clampPct(ad.value));

  document.getElementById('sBaseRate').textContent=percentDisplay(r.baseRate);
  document.getElementById('sBaseInterest').textContent=wholeMoney(r.baseInterest);
  document.getElementById('sAfterGeneral').textContent=wholeMoney(r.afterGeneral);
  document.getElementById('sUserNet').textContent=wholeMoney(r.userNet);
  document.getElementById('sAdminNet').textContent=wholeMoney(r.adminNet);
  document.getElementById('sFinalInterest').textContent=wholeMoney(r.finalInterest);
  document.getElementById('sTotal').textContent=wholeMoney(r.total);
  document.getElementById('sInstallment').textContent=wholeMoney(r.installment);
  document.getElementById('sSettlementDue').textContent=money(r.settlementDue);
}


function nextLoanNumberForUser(username){
  const starts = {
    'AHMED H ALHASHIM': 1001,
    'HANI M ALHAJJI': 2001,
    'HASSAN A ALHASHIM': 3001,
    'HASSAN J ALHASHIM': 4001,
    'HUSSAIN A BOHLIGAH': 5001,
    'MOHAMMED H ALHAJJI': 6001
  };

  const start = starts[username];
  if(!start){
    // Temporary fallback for users whose ranges have not yet been defined.
    const nums = state.loans
      .map(l=>Number(String(l.id||'').replace(/\D/g,'')))
      .filter(n=>Number.isFinite(n));
    return nums.length ? Math.max(...nums)+1 : 3001;
  }

  const used = state.loans
    .filter(l=>(l.assignedUser||l.createdBy)===username)
    .map(l=>Number(String(l.id||'').replace(/\D/g,'')))
    .filter(n=>Number.isFinite(n) && n>=start && n<start+1000);

  return used.length ? Math.max(...used)+1 : start;
}

async function saveLoan(){
  const err=document.getElementById('formError');
  const saveBtn=document.getElementById('saveLoanBtn');

  err.textContent='';

  const beneficiary=document.getElementById('beneficiary').value.trim();
  const nationalId=document.getElementById('nationalId').value.trim();
  const mobile=document.getElementById('mobile').value.trim();
  const amount=Number(document.getElementById('amount').value||0);
  const months=Number(document.getElementById('months').value||0);
  const type=document.getElementById('loanType').value;
  const dbType=loanTypeToDb(type);
  const assignedUser=document.getElementById('assignedUser').value;
  const assignedObj=state.users.find(u=>u.username===assignedUser);

  if(!assignedObj || assignedObj.role==='أدمن'){
    err.textContent='لا يمكن تخصيص قرض للأدمن.';
    return;
  }

  const gd=clampPct(document.getElementById('generalDiscount').value);
  const ud=clampPct(document.getElementById('userDiscount').value);
  const ad=clampPct(document.getElementById('adminDiscount').value);
  const loanDate=document.getElementById('loanDate').value;

  if(!beneficiary || beneficiary.split(/\s+/).length<4){
    err.textContent='يجب إدخال اسم المستفيد رباعيًا.';
    return;
  }
  if(!nationalId){
    err.textContent='رقم بطاقة الأحوال مطلوب.';
    return;
  }
  if(!mobile){
    err.textContent='رقم الجوال مطلوب.';
    return;
  }
  if(!loanDate){
    err.textContent='تاريخ القرض مطلوب.';
    return;
  }
  if(amount<500 || amount>state.maxLoan){
    err.textContent=`قيمة القرض يجب أن تكون بين 500 و ${state.maxLoan} ريال.`;
    return;
  }
  if(months<1 || months>state.maxMonths){
    err.textContent=`عدد الشهور يجب أن يكون بين 1 و ${state.maxMonths}.`;
    return;
  }
  if(!dbType){
    err.textContent='نوع القرض غير صحيح.';
    return;
  }

  saveBtn.disabled=true;
  saveBtn.textContent='جاري الحفظ...';

  try{
    const {data,error}=await supabaseClient.rpc('create_loan',{
      p_assigned_user_id: assignedObj.id,
      p_beneficiary_name: beneficiary,
      p_national_id: nationalId,
      p_mobile: mobile,
      p_loan_date: loanDate,
      p_loan_type: dbType,
      p_loan_amount: amount,
      p_months: months,
      p_general_discount: gd,
      p_user_discount: ud,
      p_admin_discount: ad
    });

    if(error) throw error;

    await loadLoansFromDatabase();

    // Move directly to the database-backed loan list.
    state.page='loans';
    render();
  }catch(e){
    console.error(e);
    err.textContent=e?.message || 'تعذر حفظ القرض في قاعدة البيانات.';
  }finally{
    const currentBtn=document.getElementById('saveLoanBtn');
    if(currentBtn){
      currentBtn.disabled=false;
      currentBtn.textContent='حفظ وإرسال لموافقة الأدمن';
    }
  }
}
